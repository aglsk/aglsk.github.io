<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AGL SK Repositórios</title>
    <link rel="shortcut icon" href="https://avatars.githubusercontent.com/u/113151786?v=4" type="image/x-icon">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" rel="stylesheet">
    <link href="./css/styles.css" rel="stylesheet">
</head>
<body>
    <!-- Navbar -->
    <header>
        <nav class="navbar">
            <a class="navbar-brand" href="#">AGL SK</a>
            <ul class="navbar-nav">
                <li><a class="nav-link" href="https://aglsk.github.io/"><i class="fas fa-home"></i> Home</a></li>
                <li><a class="nav-link" href="https://github.com/aglsk"><i class="fab fa-github"></i> GitHub</a></li>
                <li><a class="nav-link" href="https://youtube.com/@agl_sk"><i class="fab fa-youtube"></i> YouTube</a></li>
            </ul>
        </nav>
    </header>

    <!-- Main Content -->
    <main>
        <section class="repo-grid" id="repositories">
            <div class="spinner">
                <i class="fas fa-spinner"></i>
            </div>
        </section>
    </main>

    <!-- Footer -->
    <footer>
        &copy; <span id="year"></span> <a href="https://github.com/aglsk">AGL SK</a>. Todos os direitos reservados.
    </footer>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            fetchRepositories();
            updateFooterYear();
        });

        async function fetchRepositories() {
            const hiddenRepos = ["SharkRDP", "Windows-CRD", "WindowsCRD", "aglsk", "aglsk.github.io", "robok-engine.github.io", "f5pdv", "freefireguilda"];
            const repoGrid = document.getElementById("repositories");

            try {
                const response = await fetch("https://api.github.com/users/aglsk/repos");
                if (!response.ok) {
                    throw new Error("Erro ao buscar repositórios.");
                }
                const repos = await response.json();

                repoGrid.innerHTML = ""; // Remove o spinner
                const visibleRepos = repos.filter(repo => !hiddenRepos.includes(repo.name));

                for (const repo of visibleRepos) {
                    const repoDetails = await getBackgroundImage(repo);

                    const card = document.createElement("div");
                    card.classList.add("repo-card");
                    card.innerHTML = `
                        <img src="${repoDetails.background_image}" alt="${repoDetails.repo_name}" class="repo-bg-image">
                        <div class="repo-name">${repoDetails.repo_name}</div>
                    `;
                    card.addEventListener("click", () => {
                        window.open(repoDetails.html_url, "_blank");
                    });
                    repoGrid.appendChild(card);
                }
            } catch (error) {
                console.error(error);
                repoGrid.innerHTML = "<p>Ocorreu um erro ao carregar os repositórios.</p>";
            }
        }

        async function getBackgroundImage(repo) {
            try {
                const response = await fetch(`https://raw.githubusercontent.com/aglsk/${repo.name}/main/inforepo.json`);
                if (!response.ok) {
                    throw new Error("Arquivo inforepo.json não encontrado.");
                }
                const data = await response.json();
                return {
                    background_image: data.background_image || "https://via.placeholder.com/300x200",
                    repo_name: data.repo_name || repo.name,
                    html_url: repo.html_url,
                };
            } catch (error) {
                console.error(error);
                return {
                    background_image: "https://via.placeholder.com/300x200",
                    repo_name: repo.name,
                    html_url: repo.html_url,
                };
            }
        }

        function updateFooterYear() {
            const yearElement = document.getElementById("year");
            yearElement.textContent = new Date().getFullYear();
        }
    </script>
</body>
</html>
