<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AGL SK Repositórios</title>
    <link rel="shortcut icon" href="https://avatars.githubusercontent.com/u/113151786?v=4" type="image/x-icon">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./css/styles.css">
</head>
<body>
    <header>
        <nav class="navbar navbar-expand-lg navbar-dark">
            <div class="container">
                <a class="navbar-brand" href="#">AGL SK - Projetos</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item">
                            <a class="nav-link" href="https://aglsk.github.io/aglsk/">Home</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="https://github.com/aglsk">GitHub</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="https://youtube.com/@aglsk_">YouTube</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <main class="container repo-grid">
        <div id="repositories" class="row">
            <!-- Repositórios serão listados aqui -->
        </div>
    </main>

    <footer class="text-center text-white">
        <div class="container">
            <p id="currentYear">&copy; <span id="year"></span> <a href="https://github.com/aglsk">AGL SK</a> - Todos os direitos reservados.</p>
        </div>
    </footer>

    <script>
        // Atualizar ano automaticamente
        document.getElementById("year").textContent = new Date().getFullYear();
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./js/script.js"></script>
</body>
</html>
